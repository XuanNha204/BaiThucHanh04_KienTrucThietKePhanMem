name: insurance-agency-infra

services:
  eureka-server:
    build: ../eureka-server
    image: insurance/eureka-server:dev
    container_name: eureka-server
    ports: ["8761:8761"]
    networks: [insurance-net]

  postgres:
    build: ../postgres
    image: insurance/postgres:dev
    container_name: insurance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab_pass
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [insurance-net]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 20 }

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    container_name: insurance-elasticsearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["9200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    networks: [insurance-net]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"], interval: 10s, timeout: 5s, retries: 30 }

  rabbitmq:
    image: rabbitmq:3-management
    container_name: insurance-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    networks: [insurance-net]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 20 }

volumes:
  postgres-data:
  elasticsearch-data:
  rabbitmq-data:

networks:
  insurance-net:
    name: insurance-net
